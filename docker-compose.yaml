# Full stack: Qdrant + FastAPI + React/nginx.
#
#   docker compose up --build        then open http://localhost:8080
#
# To run only Qdrant (for the desktop app and webcam demos on the host):
#
#   docker compose up -d qdrant
#
# Settings can be overridden in a .env file next to this one; see .env.example.

services:
  qdrant:
    image: qdrant/qdrant:v1.20.0
    container_name: face-recognition-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_storage:/qdrant/storage
    healthcheck:
      # The image has no curl/wget, so probe the HTTP port with bash.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
      args:
        INSIGHTFACE_MODEL: ${INSIGHTFACE_MODEL:-buffalo_l}
    image: face-recognition-api
    container_name: face-recognition-api
    environment:
      QDRANT_URL: http://qdrant:6333
      MATCH_THRESHOLD: ${MATCH_THRESHOLD:-0.50}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    ports:
      # Bound to localhost only: handy for /docs, not exposed to the network.
      - "127.0.0.1:8000:8000"
    depends_on:
      qdrant:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    image: face-recognition-frontend
    container_name: face-recognition-frontend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
