[project]
name = "ai-face-recognition-platform"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "farshid92", email = "farshidcheraghchian@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "insightface>=1.0.1",
    "matplotlib>=3.11.1",
    "numpy>=2.5.1",
    "onnxruntime>=1.28.0",
    "opencv-python>=5.0.0.93",
    "pydantic>=2.13.4",
    "pyside6>=6.11.2",
    "qdrant-client>=1.19.0",
    "scikit-learn>=1.9.0",
    "uvicorn>=0.52.1",
]

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]
